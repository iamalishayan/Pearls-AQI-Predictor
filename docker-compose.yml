services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: aqi_api
    ports:
      - "8000:8000"
    command: uvicorn src.app.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: aqi_dashboard
    ports:
      - "8501:8501"
    command: streamlit run src/app/dashboard.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
